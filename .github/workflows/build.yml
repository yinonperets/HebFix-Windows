name: build-exe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile HebFix.ahk to HebFix.exe
        shell: pwsh
        run: |
          gh release download --repo AutoHotkey/AutoHotkey -p 'AutoHotkey_2*.zip' -O ahk.zip
          gh release download --repo AutoHotkey/Ahk2Exe -p 'Ahk2Exe*.zip' -O a2e.zip
          Expand-Archive ahk.zip ahk; Expand-Archive a2e.zip a2e; Get-ChildItem -Recurse -Filter *.exe ahk,a2e | Select -Expand FullName
          Start-Process -Wait -FilePath (Resolve-Path a2e/Ahk2Exe.exe) -ArgumentList '/in',"$PWD\HebFix.ahk",'/out',"$PWD\HebFix.exe",'/base',"$PWD\ahk\AutoHotkey64.exe",'/silent','verbose'
          if (!(Test-Path HebFix.exe)) { Get-ChildItem -Recurse ahk | Select -First 20; throw "compile failed" }
          Get-Item HebFix.exe
      - name: Attach to release
        shell: pwsh
        run: gh release upload v1.0.0 HebFix.exe --clobber
